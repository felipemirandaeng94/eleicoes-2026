<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícone do painel Eleições 2026: urna com cédula marcada (faixas iguais 13/22, neutras) e o ano.
       Fonte das variantes PNG em icons/ (tools/gerar_icones.py). -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4170"/><stop offset=".55" stop-color="#0d2240"/><stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <linearGradient id="urna" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9e4f2"/>
    </linearGradient>
    <clipPath id="recorte-base"><rect id="forma" width="512" height="512" rx="112"/></clipPath>
    <clipPath id="recorte-cedula"><rect x="178" y="70" width="156" height="176" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#recorte-base)">
    <rect width="512" height="512" fill="url(#fundo)"/>
    <circle cx="390" cy="96" r="150" fill="#3a7bd5" opacity=".14"/>
  </g>
  <g id="conteudo">
    <g transform="rotate(-9 256 170)">
      <g clip-path="url(#recorte-cedula)">
        <rect x="178" y="70" width="156" height="176" fill="#ffffff"/>
        <rect x="178" y="70" width="78" height="26" fill="#e35a6e"/>
        <rect x="256" y="70" width="78" height="26" fill="#4f8ff0"/>
      </g>
      <path d="M211 160l30 30 58-62" fill="none" stroke="#0b1a2e" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M132 262h248l-20 150a16 16 0 0 1-16 14H168a16 16 0 0 1-16-14z" fill="url(#urna)"/>
    <rect x="106" y="232" width="300" height="40" rx="14" fill="#ffd479"/>
    <rect x="180" y="244" width="152" height="14" rx="7" fill="#0b1a2e"/>
    <text x="256" y="378" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="78" letter-spacing="-2" fill="#0b1a2e">2026</text>
  </g>
</svg>
