name: Atualizar totalizacao TSE
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: eleicoes-2026-coleta
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: prioridade
        name: Verificar prioridade de coleta em Brasília
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          from zoneinfo import ZoneInfo
          fuso = ZoneInfo("America/Sao_Paulo")
          agora = dt.datetime.now(fuso)
          executar = agora >= dt.datetime(2026, 10, 25, 17, 0, tzinfo=fuso)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as saida:
              saida.write(f"executar={'true' if executar else 'false'}\n")
          print(f"Prioridade TSE: {'ativa' if executar else 'aguardando 17h'} ({agora.isoformat()})")
          PY
      - name: Coletar dados oficiais do TSE
        if: steps.prioridade.outputs.executar == 'true'
        run: python scripts/fetch_tse.py
      - name: Commit JSON
        if: steps.prioridade.outputs.executar == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza dados oficiais TSE"
            # O coletor do exterior também grava em main: sincronizar antes do push.
            for tentativa in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              sleep $((tentativa * 5))
            done
            echo "::error::Não foi possível enviar o commit do TSE para main"
            exit 1
          fi
