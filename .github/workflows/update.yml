name: Atualizar totalizacao TSE
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: tse-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_tse.py
      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza dados oficiais TSE"
            # O coletor do exterior também grava em main: sincronizar antes do push.
            for tentativa in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              sleep $((tentativa * 5))
            done
            echo "::error::Não foi possível enviar o commit do TSE para main"
            exit 1
          fi
