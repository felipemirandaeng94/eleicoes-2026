name: Coletar Probitas Exterior
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: coletar-probitas-exterior
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador de coleta
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Inspecionar dados públicos do Probitas
        run: python scripts/coletar_probitas.py
      - name: Salvar relatório e dados validados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probitas_diagnostico.json
          if test -f data/exterior.json; then git add data/exterior.json; fi
          if ! git diff --staged --quiet; then
            git commit -m "Coleta Probitas: diagnóstico e dados validados"
            git push
          fi
