name: Coletar Probitas Exterior
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: coletar-probitas-exterior
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador de coleta
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Inspecionar dados públicos do Probitas
        run: python scripts/coletar_probitas.py
      - name: Guardar diagnóstico sem disparar GitHub Pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probitas-diagnostico-${{ github.run_id }}
          path: data/probitas_diagnostico.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Publicar leituras validadas e histórico horário
        run: |
          if test ! -f data/exterior.json; then
            echo "Nenhum dado validado; nenhum resultado publicado."
            exit 0
          fi
          git add data/exterior.json data/historico_exterior/
          if git diff --staged --quiet; then
            echo "Nenhuma leitura nova."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Registrar coleta validada do exterior"
          git pull --rebase origin main
          git push origin HEAD:main
